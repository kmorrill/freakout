[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "freakout"
version = "0.3.0"
description = "Open lossless JSON patch tools and direct transport for Arturia MiniFreak and MicroFreak"
requires-python = ">=3.12"
license = {file = "LICENSE"}
readme = "README.md"
authors = [{name = "Kevin Morrill"}]
keywords = ["arturia", "minifreak", "microfreak", "midi", "sysex", "synthesizer"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
]
dependencies = [
    "click>=8.0",
    "pydantic>=2.0",
    "protobuf>=5.0",
    "mido>=1.3",
    "python-rtmidi>=1.5",
    "pyusb>=1.3",
]

[project.urls]
Homepage = "https://github.com/kmorrill/freakout"
Repository = "https://github.com/kmorrill/freakout"
Issues = "https://github.com/kmorrill/freakout/issues"

[project.scripts]
freakout = "minifreak_patch.cli:main"
minifreak-patch = "minifreak_patch.cli:main"
freak-patch = "minifreak_patch.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/minifreak_patch"]
